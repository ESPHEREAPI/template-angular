# ============================================
# AJOUTEZ CETTE SECTION À VOTRE DOCKER-COMPOSE.YML
# ============================================

  # ==========================================
  # FRONTEND ANGULAR - PRODUCTION
  # ==========================================
  frontend:
    build:
      context: ../chemin-vers-votre-frontend  # ← Adaptez ce chemin
      dockerfile: Dockerfile
    container_name: easycom-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - easycom-network
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================
  # FRONTEND ANGULAR - DÉVELOPPEMENT (optionnel)
  # ==========================================
  frontend-dev:
    build:
      context: ../chemin-vers-votre-frontend  # ← Adaptez ce chemin
      dockerfile: Dockerfile.dev
    container_name: easycom-frontend-dev
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      # Hot-reload : monte le code source
      - ../chemin-vers-votre-frontend/src:/app/src:ro
      - ../chemin-vers-votre-frontend/angular.json:/app/angular.json:ro
      - ../chemin-vers-votre-frontend/tsconfig.json:/app/tsconfig.json:ro
    networks:
      - easycom-network
    depends_on:
      gateway:
        condition: service_healthy