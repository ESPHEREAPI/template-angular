<div class="sf-title">Mon panier</div>

<div class="sf-card">
  <div *ngIf="(cart.items$ | async)?.length === 0" class="sf-empty">
    Votre panier est vide.
    <div style="margin-top:12px;">
      <a class="sf-btn" [routerLink]="['/shop', code]">Voir le catalogue</a>
    </div>
  </div>

  <ng-container *ngIf="(cart.items$ | async) as items">
    <div class="sf-cart-row" *ngFor="let item of items">
      <div class="sf-cart-row-info">
        <div style="font-weight:600;">{{ item.libelle }}</div>
        <div class="sf-product-ref">Ref. {{ item.reference }} &middot; {{ item.prixUnitaire | number: '1.0-0' }} FCFA</div>
      </div>
      <div class="sf-cart-row-actions">
        <div class="sf-qty-control">
          <button type="button" (click)="changerQuantite(item, item.quantite - 1)">-</button>
          <span>{{ item.quantite }}</span>
          <button type="button" (click)="changerQuantite(item, item.quantite + 1)" [disabled]="item.quantite >= item.stockDisponible">+</button>
        </div>
        <div class="sf-cart-row-total">
          {{ item.prixUnitaire * item.quantite | number: '1.0-0' }} FCFA
        </div>
        <button type="button" class="sf-btn-link" (click)="retirer(item)">Retirer</button>
      </div>
    </div>

    <div *ngIf="items.length > 0" style="display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; margin-top:20px; padding-top:16px; border-top:2px solid #eee;">
      <div class="sf-price">Total : {{ cart.total | number: '1.0-0' }} FCFA</div>
      <a class="sf-btn" [routerLink]="['/shop', code, 'checkout']">Passer la commande</a>
    </div>
  </ng-container>
</div>
