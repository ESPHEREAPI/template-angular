<div class="sf-title">Connexion</div>

<div class="sf-card" style="max-width:400px;">
  <form (ngSubmit)="connexion()">
    <div class="sf-form-group">
      <label for="email">Email</label>
      <input id="email" type="email" [(ngModel)]="email" name="email" required />
    </div>
    <div class="sf-form-group">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" [(ngModel)]="password" name="password" required />
    </div>

    <p class="sf-error" *ngIf="erreur">{{ erreur }}</p>

    <button type="submit" class="sf-btn" [disabled]="envoiEnCours">
      {{ envoiEnCours ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>

  <p style="margin-top:16px;">
    Pas encore de compte ? <a [routerLink]="['/shop', code, 'register']">Creer un compte</a>
  </p>
</div>
