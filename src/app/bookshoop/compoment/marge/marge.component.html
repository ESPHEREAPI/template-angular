<section class="content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-6">
        <h1>Marge</h1>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
          <li class="breadcrumb-item"><a href="#">Accueil</a></li>
          <li class="breadcrumb-item active">Marge</li>
        </ol>
      </div>
    </div>
  </div>
</section>

<section class="content">
  <div class="container-fluid">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Configuration des marges cibles par catégorie</h3>
        <div class="card-tools">
          <button type="button" class="btn btn-success btn-sm" (click)="openModal()">
            <i class="fas fa-plus"></i> Nouvelle marge cible
          </button>
        </div>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-bordered table-striped">
            <thead>
              <tr>
                <th>Catégorie</th>
                <th>Taux cible (%)</th>
                <th style="width: 100px">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let marge of marges">
                <td>{{ marge.categorie?.libelle }}</td>
                <td>{{ marge.tauxCible }}</td>
                <td>
                  <button class="btn btn-sm btn-primary mr-1" (click)="openEditModal(marge)">
                    <i class="fas fa-edit"></i>
                  </button>
                  <button class="btn btn-sm btn-danger" (click)="delete(marge.id!)">
                    <i class="fas fa-trash"></i>
                  </button>
                </td>
              </tr>
              <tr *ngIf="marges.length === 0">
                <td colspan="3" class="text-center">Aucune marge cible configurée</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Modal Marge Cible -->
<div class="modal fade" id="margeModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">{{ editingId ? 'Modifier la marge cible' : 'Nouvelle marge cible' }}</h4>
        <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="form-group">
            <label>Catégorie *</label>
            <select class="form-control" [(ngModel)]="newMarge.categorieId" name="categorie" [disabled]="editingId !== null">
              <option [ngValue]="0">-- Sélectionner --</option>
              <option *ngFor="let categorie of categories" [ngValue]="categorie.id">{{ categorie.libelle }}</option>
            </select>
          </div>
          <div class="form-group">
            <label>Taux cible (%) *</label>
            <input type="number" step="0.01" class="form-control" [(ngModel)]="newMarge.tauxCible" name="tauxCible">
          </div>
        </form>
      </div>
      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-default" data-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-primary" (click)="save()">Enregistrer</button>
      </div>
    </div>
  </div>
</div>
