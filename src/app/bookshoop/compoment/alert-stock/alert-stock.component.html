<div 
  class="toast custom-alert fade show bg-danger text-white shadow-lg animate__animated animate__shakeX"
  style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; min-width: 350px; max-width: 400px;"
  *ngIf="show"
>
  <div class="toast-header bg-dark text-white d-flex align-items-center">
    <img src="/warning-stock.png" class="rounded mr-2" alt="Alerte" style="width: 20px; height: 20px;">
    <strong class="mr-auto">Alerte Approvisionnement</strong>
    
    <!-- Indicateur de progression pour plusieurs produits -->
    <div *ngIf="hasMultipleProducts" class="mr-2">
      <small class="text-muted">{{ currentProductIndex + 1 }}/{{ products.length }}</small>
    </div>
    
    <button type="button" class="ml-2 mb-1 close text-white" (click)="close()">&times;</button>
  </div>

  <!-- Barre de progression -->
  <div *ngIf="hasMultipleProducts" class="progress" style="height: 3px; border-radius: 0;">
    <div class="progress-bar bg-warning" 
         [ngStyle]="{ width: progressPercentage + '%', transition: 'width 0.3s ease' }"></div>
  </div>

  <div class="toast-body position-relative">
    <!-- Contenu du produit avec animation -->
    <div class="product-content" 
         [class.slide-out]="isAnimating"
         style="transition: all 0.5s ease-in-out;">
      
      <div *ngIf="currentProduct" class="d-flex align-items-start">
        <div class="mr-3">
          <i class="fas fa-exclamation-triangle text-warning" style="font-size: 1.5rem;"></i>
        </div>
        
        <div class="flex-grow-1">
          <h6 class="mb-1 font-weight-bold">{{ currentProduct.name }}</h6>
          <p class="mb-1">
            <span *ngIf="currentProduct.quantity === 0" class="badge badge-danger">
              Rupture de stock
            </span>
            <span *ngIf="currentProduct.quantity > 0" class="badge badge-warning">
              Stock faible: {{ currentProduct.quantity }} restant(s)
            </span>
          </p>
          <small *ngIf="currentProduct.category" class="text-warning">
            Reference: {{ currentProduct.ref }} <br>
            Catégorie: {{ currentProduct.category }}
          </small>
        </div>
      </div>
    </div>

    <!-- Contrôles de navigation pour plusieurs produits -->
    <div *ngIf="hasMultipleProducts" class="d-flex justify-content-between align-items-center mt-3">
      <button class="btn btn-sm btn-outline-light" 
              (click)="previousProduct()" 
              [disabled]="isAnimating">
        <i class="fas fa-chevron-left"></i>
      </button>

      <div class="d-flex">
        <span *ngFor="let product of products; let i = index" 
              class="dot mx-1"
              [class.active]="i === currentProductIndex"
              style="width: 8px; height: 8px; border-radius: 50%; background-color: rgba(255,255,255,0.3); transition: all 0.3s ease;"
              [style.background-color]="i === currentProductIndex ? 'white' : 'rgba(255,255,255,0.3)'">
        </span>
      </div>

      <button class="btn btn-sm btn-outline-light" 
              (click)="nextProduct()" 
              [disabled]="isAnimating">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>

  <!--   <audio #alertAudio src="assets/sounds/alert-stock.mp3"></audio> -->
  </div>
</div>
