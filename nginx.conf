# ============================================
# CONFIGURATION NGINX - FRONTEND ANGULAR
# ============================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ✅ AJOUT : Proxy vers le Gateway Spring Cloud (avec gateway-proxy)
    location /gateway-proxy/ {
        proxy_pass http://gateway:8080/gateway-proxy/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Proxy vers le Gateway Spring Cloud (sans gateway-proxy - pour compatibilité)
    location /api/ {
        proxy_pass http://gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Racine du serveur : redirige vers ce projet, en attendant que
    # d'autres cohabitent sur ce meme port sous leur propre prefixe
    # (ex. /paie/) - a retirer/adapter quand ce sera le cas.
    location = / {
        return 302 /esacom-pro/;
    }

    # Routes Angular (SPA) - servies sous /esacom-pro/ pour permettre a
    # d'autres projets de cohabiter sur ce meme port, chacun sous son
    # propre prefixe de chemin. Le build Angular est genere avec
    # --base-href=/esacom-pro/ (voir Dockerfile).
    location /esacom-pro/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /esacom-pro/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache pour les assets statiques (le groupe capture retire le
    # prefixe /esacom-pro/ avant de mapper vers le fichier reel)
    location ~* ^/esacom-pro/(.+\.(?:jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot))$ {
        alias /usr/share/nginx/html/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}